server {

    listen 81;
    server_name _; # svarer på alle forespørsler uavhengig av domenenavn

    location /api/ {
        # videresend forespørsler til backend-tjenesten
        proxy_pass http://studentblogg-api:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }    
}